services:
  yamtrack:

  ryot:
    image: ignisda/ryot:v10
    environment:
      - SERVER_ADMIN_ACCESS_TOKEN=CHANGE_ME_TO_A_LONG_RANDOM_STRING
      - DATABASE_URL=postgres://postgres:postgres@ryot-db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    x-runtipi:
      is_main: true
      internal_port: 8000

  db:
    image: postgres:18-alpine
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_DB=yamtrack
      - POSTGRES_USER=yamtrack
      - POSTGRES_PASSWORD=${SECRET}
    x-runtipi:
      add_to_main_network: true
x-runtipi:
  schema_version: 2